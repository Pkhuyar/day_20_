<!DOCTYPE html>
<html>

<head>
    <title>Edit Todo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

    <h2>Edit Task</h2>

    <form method="POST" enctype="multipart/form-data">
        {{ form.hidden_tag() }}

        <div class="mb-3">
            {{ form.task }}
        </div>

        <div class="mb-3">
            {{ form.image }}
        </div>

        {% if todo.image %}
        <img src="{{ url_for('static', filename='uploads/' + todo.image) }}" width="200" class="mb-3">
        {% endif %}

        {{ form.submit }}

    </form>

</body>

</html>
